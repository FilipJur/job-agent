# Model policy for every omp session started in this repo or its worktrees (workers).
# Session model: Muse Spark 1.3 Contributor, fallback DeepSeek V4.1 Flash.
# Subagent model: DeepSeek V4.1 Flash, fallback Muse Spark 1.3 Contributor. Workers stay on OpenCode Go (user decision).
modelRoles:
  default: opencode-go/muse-spark-1.3-contributor
  task: opencode-go/deepseek-v4.1-flash
  smol: opencode-go/deepseek-v4.1-flash
  # The global vision role is an OpenCode Go model outside the allowed pair (muse spark, deepseek flash).
  vision: anthropic/claude-sonnet-5-5
retry:
  modelFallback: true
  fallbackChains:
    default:
      - opencode-go/deepseek-v4.1-flash
    task:
      - opencode-go/muse-spark-1.3-contributor
    smol:
      - opencode-go/muse-spark-1.3-contributor
task:
  agentModelOverrides:
    task: "@task"
    scout: "@task"
    sonic: "@task"
    reviewer: "@task"
    librarian: "@task"
    designer: "@task"
