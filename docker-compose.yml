services:
  web:
    build: .
    image: job-agent:local
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    env_file: .env
    environment:
      HOST: "0.0.0.0"
    restart: unless-stopped

  # One-off commands: `docker compose run --rm cli` runs `daily`;
  # `docker compose run --rm cli <script> [args]` runs any package.json script (score, collect, agencies:seed).
  cli:
    image: job-agent:local
    profiles: ["cli"]
    volumes:
      - ./data:/app/data
    env_file: .env
    entrypoint: ["bun", "run"]
    command: ["daily"]
